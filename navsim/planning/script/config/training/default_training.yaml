hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra           # Store hydra's config breakdown here for debugging
  searchpath:                                       # Only <exp_dir> in these paths are discoverable
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  - default_train_val_test_log_split
  - agent: ego_status_mlp_agent
  - _self_

split: trainval

# Training scene subset: full (all train_logs) | high_risk (token whitelist)
train_scene_subset: full
# Validation scene subset: full (all val_logs on trainval) | high_risk_test (navtest token whitelist)
val_scene_subset: full
# Run full validation once before training (logged at global_step=0, no checkpoint saved)
run_baseline_validation: true

high_risk:
  tokens_path: ${oc.env:NAVSIM_DEVKIT_ROOT}/scripts/filter_high_risk_scenes/high_risk_train/high_risk_train.txt
  val_tokens_path: ${oc.env:NAVSIM_DEVKIT_ROOT}/scripts/filter_high_risk_scenes/high_risk_test/high_risk_test.txt
  # When true, high_risk training searches both train_logs and val_logs on trainval.
  include_val_logs: true

validation:
  metric_cache_path: ${oc.env:NAVSIM_EXP_ROOT}/metric_cache
  scene_filter:
    _target_: navsim.common.dataclasses.SceneFilter
    _convert_: all
    num_history_frames: 4
    num_future_frames: 10
    frame_interval: 1
    has_route: true
    max_scenes: null
    log_names: null
    tokens: null

cache_path: ${oc.env:NAVSIM_EXP_ROOT}/training_cache_transfuser
use_cache_without_dataset: false # load the training samples from the cache. scene-filter will be ignored
force_cache_computation: true
seed: 0

dataloader:
  params:
    batch_size: 16  # number of samples per batch
    num_workers: 8  # number of workers for data loading
    pin_memory: true  # pin memory for faster GPU transfer
    prefetch_factor: 2  # number of samples loaded in advance by each worker
    drop_last: true  # drop the last incomplete batch if the dataset size is not divisible by the batch size
    persistent_workers: true  # keep workers alive between epochs for faster data loading

trainer:
  params:
    # set "-1" if not use any
    max_epochs: 10  # maximum number of training epochs
    max_steps: 3  # maximum number of training steps (operate logic: max_epochs AND max_steps, whichever is reached first)

    # check_val_every_n_epoch: 1  # run validation set every n training epochs
    val_check_interval: 100  # (float) [%] run validation set every X% of training set OR (int) run validation set every X training steps
    log_every_n_steps: 10  # log training metrics every n steps

    limit_train_batches: 1.0  # how much of training dataset to check (float = fraction, int = num_batches)
    limit_val_batches: 1.0  # how much of validation dataset to check (float = fraction, int = num_batches)

    accelerator: gpu  # distribution method

    strategy: ddp
    precision: 16-mixed  # floating point precision
    num_nodes: 1  # Number of nodes used for training
    devices: 8
    num_sanity_val_steps: 0  # number of validation steps to run before training begins
    fast_dev_run: false  # runs 1 batch of train/val/test for sanity

    accumulate_grad_batches: 1  # accumulates gradients every n batches

    # track_grad_norm: -1  # logs the p-norm for inspection TODO ？

    # 手动
    # gradient_clip_val: 1.0  # value to clip gradients 
    # gradient_clip_algorithm: norm  # [value, norm] method to clip gradients

    default_root_dir: ${output_dir}