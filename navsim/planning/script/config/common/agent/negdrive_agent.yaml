_target_: navsim.agents.negdrive.negdrive_agent.NegDriveAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5


vlm_path: ''
vlm_lora_path: ''
vlm_type: 'internvl'
vlm_size: 'small'
vlm_lr: 1e-5
opt_type: 'AdamW'
opt_weight_decay: 0.01
opt_eps: 1e-8
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

diff_path: ''
dit_type: 'small'
diff_sampling_method: 'ddim'

metric_cache_path: ''

mode: 'train'  

per_sample_rollout: 4
bag_g: 4
max_text_tokens: 128
max_padding_len: 2800
# Training rollout sampling; validation uses greedy decoding (val_do_sample=false)
rollout_temperature: 0.7
val_do_sample: false

# Planner conditioning for training rollouts, validation and probes:
# False = full sequence (image + prompt + CoT); True = CoT tokens only (text-only forward).
# Generation and policy log-probs stay image-conditioned either way.
pass_cot_token_only: False

# VLM RL algorithm: nsr (negative sample reinforcement) | grpo (group relative policy optimization)
#                   | hybrid | psr | mars (noise-marginalized negative reinforcement)
#                   | pps (planner-potential shaping; uses mars_cfg for K / CRN / cost)
rl_algorithm: nsr

grpo_cfg:
  advantage_eps: 1.0e-8
  clip_advantage_lower_quantile: 0.0
  clip_advantage_upper_quantile: 1.0
  skip_zero_std_groups: true

# Only used when rl_algorithm=mars (see navsim/agents/negdrive/utils/mars.py)
mars_cfg:
  num_planner_samples: 4        # K planner noises per CoT
  common_random_numbers: true   # share the K noises across the G CoTs of a scene
  progress_coef: 0.5            # beta; 0 disables the progress hinge (pure safety cost)
  progress_min: 0.6             # safe samples with EP below this are penalized
  baseline: none                # none (pure negative) | group_mean
  advantage_eps: 1.0e-6

# Only used when rl_algorithm=pps (see navsim/agents/negdrive/utils/pps.py)
pps_cfg:
  max_segments: 4               # CoT segments probed per rollout (prefix potentials at P boundaries)
  shaping_coef: 1.0             # lambda on segment potential differences
  negative_only: true           # only blame segments that increased risk
  probe: failures               # failures (rollouts with cost > 0) | all
  use_stage_markers: true       # split at the prompt's stage headings when present
  advantage_eps: 1.0e-6
  estimator: truncate           # truncate (planner reads the CoT prefix) | mc (VLM finishes the CoT M times)
  mc_continuations: 2           # M, only for estimator=mc
