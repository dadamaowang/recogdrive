_target_: navsim.agents.negdrive.negdrive_agent.NegDriveAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5


vlm_path: ''
vlm_lora_path: ''
vlm_type: 'internvl'
vlm_size: 'small'
vlm_lr: 1e-5
opt_type: 'AdamW'
opt_weight_decay: 0.01
opt_eps: 1e-8
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

diff_path: ''
dit_type: 'small'
diff_sampling_method: 'ddim'

metric_cache_path: ''

mode: 'train'  

per_sample_rollout: 4
bag_g: 4
max_text_tokens: 128
max_padding_len: 2800
# Training rollout sampling; validation uses greedy decoding (val_do_sample=false)
rollout_temperature: 0.7
val_do_sample: false

pass_cot_token_only: False

# VLM RL algorithm: nsr (negative sample reinforcement) | grpo (group relative policy optimization)
rl_algorithm: nsr

grpo_cfg:
  advantage_eps: 1.0e-8
  clip_advantage_lower_quantile: 0.0
  clip_advantage_upper_quantile: 1.0
  skip_zero_std_groups: true

# Structured CoT prompt: the VLM writes one tagged section per stage (needed by TEMPO).
# Off = original free-form prompt, unchanged.
structured_cot: false
segment_tags: ['<perception>', '<prediction>', '<decision>', '<check>', '<trajectory>']

# TEMPO: segment-level prefix-tree TD correction on the GRPO advantage (rl_algorithm=grpo).
# Off = plain GRPO, unchanged. Spec: TEMPO.md; code: navsim/agents/negdrive/utils/tempo.py; tests: tests/test_tempo.py.
tempo_cfg:
  enabled: false
  td_coef: 1.0                  # 0 reproduces the GRPO advantage
  delta_mode: broadcast         # broadcast | first_token
  node_match: exact_normalized  # exact_normalized | key_fn | embedding
  sim_threshold: 0.9            # embedding only (cosine, average linkage)
  key_fn: null                  # key_fn: "module.path:function" (default hook: tempo.segment_key_fn)
  embedder: null                # embedding: "module.path:function" (default: bag of words)
  strict_order: true
  warn_compliance_below: 0.5
  warn_nodes_per_response_above: 0.99
