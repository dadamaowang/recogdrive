vlm_type: 'internvl'
vlm_size: 'small'
vlm_lr: 1e-5
opt_type: 'AdamW'
opt_weight_decay: 0.01
opt_eps: 1e-8

diff_path: ''
dit_type: 'small'
diff_sampling_method: 'ddim'

metric_cache_path: ''

mode: 'train'  

per_sample_rollout: 4
bag_g: 4
max_text_tokens: 128
max_padding_len: 2800
